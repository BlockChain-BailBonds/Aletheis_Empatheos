<script>
// ------------------------------------------------------------
// LOGGING
// ------------------------------------------------------------
function log(msg) {
    const logBox = document.getElementById("log");
    logBox.textContent += msg + "\n";
    logBox.scrollTop = logBox.scrollHeight;
}

// ------------------------------------------------------------
// CAPABILITY DETECTION
// ------------------------------------------------------------
function supportsZeroTouch() {
    return (
        typeof window.showDirectoryPicker === "function" &&
        typeof window.showSaveFilePicker === "function"
    );
}

// ------------------------------------------------------------
// FILESYSTEM WRITE ABSTRACTION (MODE A)
// ------------------------------------------------------------
let rootDirHandle = null;

async function selectRootDirectory() {
    rootDirHandle = await window.showDirectoryPicker();
    return rootDirHandle;
}

async function writeFileZeroTouch(path, contents) {
    const parts = path.split("/");
    let current = rootDirHandle;

    for (let i = 0; i < parts.length - 1; i++) {
        const folder = parts[i];
        let handle;
        try {
            handle = await current.getDirectoryHandle(folder, { create: true });
        } catch (err) {
            throw new Error("Directory creation failed: " + folder);
        }
        current = handle;
    }

    const fileName = parts[parts.length - 1];
    const fileHandle = await current.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();

    if (typeof contents === 'string') {
        await writable.write(contents);
    } else {
        await writable.write(contents);
    }
    
    await writable.close();
    return true;
}

// ------------------------------------------------------------
// FALLBACK MODE B
// ------------------------------------------------------------
const fallbackFiles = {};

function prepareFallbackFile(path, contents) {
    if (contents instanceof Uint8Array) {
        fallbackFiles[path] = contents;
    } else {
        fallbackFiles[path] = contents;
    }
}

async function downloadFallbackFiles() {
    for (const [path, contents] of Object.entries(fallbackFiles)) {
        let blob;
        let fileContents = contents;
        let mimeType = "text/plain";

        if (fileContents instanceof Uint8Array) {
            blob = new Blob([fileContents], { type: "application/octet-stream" });
            mimeType = "application/octet-stream";
        } else {
            blob = new Blob([fileContents], { type: "text/plain" });
        }

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        const filename = path.split('/').pop(); 
        a.download = filename; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);
        log("Generated fallback file: " + path);
    }
    log("Fallback Mode B complete. You must manually organize the downloaded files into the 'SigilOS' directory structure.");
    log("Then, run 'bash setup.sh' after extraction.");
}

// ------------------------------------------------------------
// INSTALL MODE SWITCH
// ------------------------------------------------------------
async function startInstallation() {

    log("Checking capabilities...");

    if (supportsZeroTouch()) {
        log("Zero-Touch Mode supported.");
        log("Requesting filesystem access...");
        try {
            await selectRootDirectory();
            log("Access granted. Proceeding with direct deployment.");
        } catch (err) {
            log("Access denied or cancelled. Falling back to Mode B.");
            return "fallback";
        }
        return "zerotouch";
    } else {
        log("Zero-Touch Mode NOT supported. Switching to Mode B.");
        return "fallback";
    }
}

<script>
// ============================================================
// BLOCK 3: JS EQUATION ENGINE
// ============================================================

function glyphToIndex(glyph) {
    for (let i = 0; i < GLYPH_ALPHABET.forward.length; i++) {
        const pair = GLYPH_ALPHABET.forward[i];
        if (pair[0] === glyph || pair[1] === glyph) return i;
    }
    throw new Error("Unknown glyph: " + glyph);
}

function encodeToGlyphs(plaintext) {
    let glyphs = "";
    const len = GLYPH_ALPHABET.forward.length;
    for (let i = 0; i < plaintext.length; i++) {
        const code = plaintext.charCodeAt(i);
        const index = code % len;
        const pair = GLYPH_ALPHABET.forward[index];
        const glyph = pair[(code % 2)];
        glyphs += glyph;
    }
    return glyphs;
}

function decodeFromGlyphs(glyphString) {
    let out = "";
    const len = GLYPH_ALPHABET.forward.length;
    for (const g of glyphString) {
        let index;
        try {
            index = glyphToIndex(g);
        } catch {
            continue;
        }
        
        const pair = GLYPH_ALPHABET.forward[index];
        const pos = (pair[0] === g) ? 0 : 1; 
        const code = (index + (pos * len)) % 256; 
        out += String.fromCharCode(code);
    }
    return out;
}

function glyphEquation(glyphString) {
    let sum = 0;
    for (const g of glyphString) {
        sum += glyphToIndex(g);
    }
    const resultIndex = sum % GLYPH_ALPHABET.forward.length;
    const block = getSigilBlock(resultIndex);
    return block[0][0];
}

function integrityVector(glyphString) {
    let sum = 0;
    for (const g of glyphString) sum += glyphToIndex(g);
    const base = sum % GLYPH_ALPHABET.forward.length;
    const block = getSigilBlock(base);
    return block.flat().join(""); 
}

function rehydratePayload(payloadGlyphs, equationGlyph) {
    const decoded = decodeFromGlyphs(payloadGlyphs);
    return decoded + equationGlyph;
}

log("Equation engine loaded.");

<script>
// ============================================================
// BLOCK 4: AES + GVOLX (with PKCS7 Padding)
// ============================================================

const encoder = new TextEncoder();
const decoder = new TextDecoder();

function pkcs7Pad(data) {
    const blockSize = 16;
    const padLength = blockSize - (data.length % blockSize);
    const padded = new Uint8Array(data.length + padLength);
    padded.set(data);
    padded.fill(padLength, data.length);
    return padded;
}

function pkcs7Unpad(data) {
    const padLength = data[data.length - 1];
    return data.slice(0, data.length - padLength);
}

async function sha256(data) {
    const hash = await crypto.subtle.digest("SHA-256", data);
    return new Uint8Array(hash);
}

async function deriveKeyAndIV(equationGlyph, integrityGlyphs) {
    const seed = equationGlyph + integrityGlyphs; 
    const seedBytes = encoder.encode(seed);
    const hash = await sha256(seedBytes);

    const keyBytes = hash.slice(0, 32);
    const ivBytes = hash.slice(0, 16);

    const key = await crypto.subtle.importKey(
        "raw",
        keyBytes,
        { name: "AES-CBC" },
        false,
        ["encrypt", "decrypt"]
    );

    return { key, iv: ivBytes };
}

async function encryptPayload(plaintext, equationGlyph, integrityGlyphs) {
    const { key, iv } = await deriveKeyAndIV(equationGlyph, integrityGlyphs);
    const data = encoder.encode(plaintext);
    const padded = pkcs7Pad(data);
    const encrypted = await crypto.subtle.encrypt(
        { name: "AES-CBC", iv },
        key,
        padded
    );

    return new Uint8Array(encrypted);
}

async function decryptPayload(cipherBytes, equationGlyph, integrityGlyphs) {
    const { key, iv } = await deriveKeyAndIV(equationGlyph, integrityGlyphs);

    const decrypted = await crypto.subtle.decrypt(
        { name: "AES-CBC", iv },
        key,
        cipherBytes
    );

    const unpadded = pkcs7Unpad(new Uint8Array(decrypted));
    return decoder.decode(unpadded);
}

function buildGvolx(integrityGlyphs, equationGlyph, encryptedBytes) {
    const MAGIC = encoder.encode("GVX01");
    const VERSION = new Uint8Array([0x01]);
    const integrityBytes = encoder.encode(integrityGlyphs);
    const equationBytes = encoder.encode(equationGlyph);
    const eqLen = new Uint8Array([equationBytes.length]);

    const payloadLen = new Uint8Array(4);
    new DataView(payloadLen.buffer).setUint32(0, encryptedBytes.length, false);

    const totalLen =
        MAGIC.length +
        VERSION.length +
        integrityBytes.length +
        eqLen.length +
        equationBytes.length +
        payloadLen.length +
        encryptedBytes.length;

    const out = new Uint8Array(totalLen);
    let offset = 0;

    out.set(MAGIC, offset); offset += MAGIC.length;
    out.set(VERSION, offset); offset += VERSION.length;
    out.set(integrityBytes, offset); offset += integrityBytes.length;
    out.set(eqLen, offset); offset += eqLen.length;
    out.set(equationBytes, offset); offset += equationBytes.length;
    out.set(payloadLen, offset); offset += payloadLen.length;
    out.set(encryptedBytes, offset);

    return out;
}

function parseGvolx(bytes) {
    const MAGIC = "GVX01";
    const magicString = decoder.decode(bytes.slice(0, 5));
    if (magicString !== MAGIC) throw new Error("Invalid GVOLX format");

    const version = bytes[5];
    if (version !== 0x01) throw new Error("Unsupported version");

    const integrityGlyphs = decoder.decode(bytes.slice(6, 10)); 
    const eqLen = bytes[10];
    const equationGlyph = decoder.decode(bytes.slice(11, 11 + eqLen)); 

    const payloadLenOffset = 11 + eqLen;
    const payloadLenBytes = bytes.slice(payloadLenOffset, payloadLenOffset + 4);

    const payloadLen = new DataView(payloadLenBytes.buffer).getUint32(0, false);
    const payloadOffset = payloadLenOffset + 4;
    const payloadBytes = bytes.slice(payloadOffset, payloadOffset + payloadLen);

    return {
        integrityGlyphs,
        equationGlyph,
        payloadBytes
    };
}

async function generateDemoGvolx() {
    const demoPlaintext = "SigilOS Initialized.";
    const glyphs = encodeToGlyphs(demoPlaintext);
    const eqGlyph = glyphEquation(glyphs);
    const integrity = integrityVector(glyphs);

    const encryptedBytes = await encryptPayload(demoPlaintext, eqGlyph, integrity);
    return buildGvolx(integrity, eqGlyph, encryptedBytes);
}

log("AES + GVOLX ready.");

async function loadGvolxFile(fileHandle) {
    const file = await fileHandle.getFile();
    const arrayBuffer = await file.arrayBuffer();
    return new Uint8Array(arrayBuffer);
}

async function rehydrateFromGvolx(bytes) {
    const parsed = parseGvolx(bytes);

    const integrityGlyphs = parsed.integrityGlyphs;
    const equationGlyph = parsed.equationGlyph;
    const payloadBytes = parsed.payloadBytes;

    const plaintext = await decryptPayload(
        payloadBytes,
        equationGlyph,
        integrityGlyphs
    );

    const payloadGlyphs = encodeToGlyphs(plaintext);
    const finalOutput = rehydratePayload(payloadGlyphs, equationGlyph);

    return {
        ok: true,
        plaintext,
        finalOutput,
        integrityGlyphs,
        equationGlyph
    };
}

class GlyphEquationEngine:
    def __init__(self):
        self.alphabet_len = len(GLYPH_ALPHABET["forward"])

    def _glyph_to_index(self, glyph):
        for i, pair in enumerate(GLYPH_ALPHABET["forward"]):
            if glyph in pair:
                return i
        raise ValueError(f"Unknown glyph: {glyph}")

    def encode(self, plaintext: str) -> str:
        glyphs = ""
        for char in plaintext:
            code = ord(char)
            index = code % self.alphabet_len
            pair = GLYPH_ALPHABET["forward"][index]
            glyph = pair[(code % 2)]
            glyphs += glyph
        return glyphs

        for g in glyphs:
            index = self._glyph_to_index(g)
            pair = GLYPH_ALPHABET["forward"][index]
            pos = 0 if pair[0] == g else 1
            code = (index + (pos * self.alphabet_len)) % 256
            out += chr(code)
        return out

    def equation(self, glyphs: str) -> str:
        sum_val = sum(self._glyph_to_index(g) for g in glyphs)
        result_index = sum_val % self.alphabet_len
        block = get_sigil_block(result_index)
        return block[0][0]

        sum_val = sum(self._glyph_to_index(g) for g in glyphs)
        base = sum_val % self.alphabet_len
        block = get_sigil_block(base)
        return "".join(block[0]) + "".join(block[1])

const PY_SIGIL_GVOLX = `#!/usr/bin/env python3
import struct
from Crypto.Cipher import AES
from Crypto.Hash import SHA256

MAGIC = b"GVX01"
VERSION = b"\\x01"

def pkcs7_unpad(data):
    pad_len = data[-1]
    return data[:-pad_len]

def sha256(data):
    h = SHA256.new()
    h.update(data)
    return h.digest()

def derive_key_iv(eq, integrity):
    seed = (eq + integrity).encode("utf-8")
    hash_bytes = sha256(seed)
    key = hash_bytes[:32]
    iv = hash_bytes[:16]
    return key, iv

def decode_gvolx(path):
    with open(path, "rb") as f:
        data = f.read()

    if len(data) < 15 or data[:5] != MAGIC:
        raise ValueError("Invalid GVOLX file")

    integrity = data[6:10].decode("utf-8")
    eq_len = data[10]
    equation = data[11:11+eq_len].decode("utf-8")

    payload_len_offset = 11 + eq_len
    payload_len = struct.unpack(">I", data[payload_len_offset:payload_len_offset+4])[0]
    payload_offset = payload_len_offset + 4
    payload = data[payload_offset:payload_offset+payload_len]

    key, iv = derive_key_iv(equation, integrity)

    cipher = AES.new(key, AES.MODE_CBC, iv)
    decrypted = cipher.decrypt(payload)

    unpadded = pkcs7_unpad(decrypted)
    return unpadded.decode("utf-8", errors="ignore")
`;

    await writeFileZeroTouch(CORE_PATH + "/sigil_rehydrator.py", PY_SIGIL_REHYDRATOR);

    await writeFileZeroTouch(CORE_PATH + "/sigil_agent.py", PY_SIGIL_AGENT);
    await writeFileZeroTouch(INSTALL_PATH + "/setup.sh", SH_SETUP);

    const cliScript = `#!/usr/bin/env bash
python3 ~/SigilOS/core/sigil_agent.py "$@"`;
    await writeFileZeroTouch(BIN_PATH + "/sigilos", cliScript);

    const demoGvolxBytes = await generateDemoGvolx();
    await writeFileZeroTouch(DATA_PATH + "/demo.gvolx", demoGvolxBytes);

    log("Mode A deployment complete.");
}

function deploySigilOSFallback() {
    log("Preparing Mode B fallback files...");

    prepareFallbackFile(SIGIL_OS_ROOT + "/core/glyph_equations.py", PY_GLYPH_EQUATIONS);
    prepareFallbackFile(SIGIL_OS_ROOT + "/core/sigil_equations.py", PY_SIGIL_EQUATIONS);
    prepareFallbackFile(SIGIL_OS_ROOT + "/core/sigil_rehydrator.py", PY_SIGIL_REHYDRATOR);
    prepareFallbackFile(SIGIL_OS_ROOT + "/core/sigil_gvolx.py", PY_SIGIL_GVOLX);
    prepareFallbackFile(SIGIL_OS_ROOT + "/core/sigil_agent.py", PY_SIGIL_AGENT);
    prepareFallbackFile(SIGIL_OS_ROOT + "/install/setup.sh", SH_SETUP);

    log("Mode B fallback package ready.");
}

window.SigilOSBootstrap = {
    modeA: deploySigilOSZeroTouch,
    modeB: deploySigilOSFallback
};

log("Bootstrap ready.");
</script>

<script>
// ============================================================
// BLOCK 7: INSTALL ORCHESTRATION
// ============================================================
let installMode = null;

async function runFullInstallation() {
    log("Beginning deployment...");
    document.getElementById("init").disabled = true;

    installMode = await startInstallation();

    if (installMode === "zerotouch") {
        log("Executing Mode A...");
        try {
            await SigilOSBootstrap.modeA();
            log("--- INSTALL COMPLETE ---");
            log("CLI installed as: SigilOS/bin/sigilos");
            log("Test volume: SigilOS/data/volumes/demo.gvolx");
            enableRehydrationUI();
        } catch (err) {
            log("Mode A failed: " + err.message);
            log("Switching to Mode B...");
            SigilOSBootstrap.modeB();
            await downloadFallbackFiles();
        }
    } else {
        log("Executing Mode B...");
        SigilOSBootstrap.modeB();
        await downloadFallbackFiles();
        log("--- INSTALL COMPLETE (Fallback) ---");
    }

    document.getElementById("init").disabled = false;
}

document.getElementById("init").onclick = async () => {
    log("Initialization started...");
    await runFullInstallation();
};

function enableRehydrationUI() {
    const container = document.createElement("div");
    const btn = document.createElement("button");
    btn.textContent = "Rehydrate .gvolx (Browser)";
    btn.onclick = async () => {
        await selectAndRehydrateGvolx();
    };
    container.appendChild(btn);
    document.body.appendChild(container);

    log("Rehydration UI enabled.");
}

log("Installer ready.");
</script>

<script>
// ============================================================
// BLOCK 8: VOLUME BUILDER UI
// ============================================================

function addVolumeBuilderUI() {
    const container = document.createElement("div");
    container.style.marginTop = "20px";

    const title = document.createElement("h3");
    title.textContent = "Build .gvolx Volume";

    const textarea = document.createElement("textarea");
    textarea.rows = 6;
    textarea.cols = 60;
    textarea.style.background = "#111";
    textarea.style.color = "#0f0";
    textarea.style.border = "1px solid #0f0";
    textarea.style.display = "block";
    textarea.style.marginBottom = "10px";

    const btn = document.createElement("button");
    btn.textContent = "Build .gvolx";

    btn.onclick = async () => {
        const text = textarea.value || "";
        if (!text) {
            log("No plaintext entered.");
            return;
        }
        try {
            const glyphs = encodeToGlyphs(text);
            const eqGlyph = glyphEquation(glyphs);
            const integrity = integrityVector(glyphs);
            const encrypted = await encryptPayload(text, eqGlyph, integrity);
            const bytes = buildGvolx(integrity, eqGlyph, encrypted);

            const blob = new Blob([bytes], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "volume.gvolx";
            a.click();
            URL.revokeObjectURL(url);
            log("Built volume.gvolx");
        } catch (err) {
            log("Error: " + err.message);
        }
    };

    container.appendChild(title);
    container.appendChild(textarea);
    container.appendChild(btn);
    document.body.appendChild(container);
}

window.addEventListener("load", () => {
    addVolumeBuilderUI();
});
</script>
